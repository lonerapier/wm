[project]
name = "wm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "lonerapier", email = "lonerapier@proton.me" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "einops>=0.8.2",
    "gymnasium[mujoco]>=1.4.0",
    "h5py>=3.16.0",
    "hdf5plugin>=7.1.0",
    "huggingface-hub>=2.2.0",
    "numpy>=2.2.6",
    "ogbench>=1.2.1",
    "python-dotenv>=1.2.4",
    "torch>=2.4.0",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "tyro>=1.0.16",
    "vastai>=1.9.1",
    "wandb>=0.31.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["*.py"]
addopts = "--import-mode=importlib"
